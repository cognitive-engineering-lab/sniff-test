[package]
name = "sniff-test-audit-bridge"
version.workspace = true
edition.workspace = true

[dependencies]
toml = "0.7"
toml_edit = "0.19"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sniff-test-report = { path = "../sniff-test-report" }
tempfile = "3"
similar = "2"
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
fs2 = "0.4"
globset = "0.4"
