[package]
name = "sniff-test"
version.workspace = true
edition.workspace = true

[dependencies]
sniff-test-audit-bridge = { path = "../sniff-test-audit-bridge" }
sniff-test-audit-gui = { path = "../sniff-test-audit-gui" }
anyhow = "1"
cargo_metadata = "0.19"
clap = { version = "4.6", features = ["derive"] }
sniff-test-core = { path = "../sniff-test-core" }
sniff-test-effects = { path = "../sniff-test-effects" }
sniff-test-diagnostics = { path = "../sniff-test-diagnostics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sniff-test-report = { path = "../sniff-test-report" }
insta = { version = "1", features = ["json"] }
tempfile = "3"

[package.metadata.rust-analyzer]
rustc_private = true
