[package]
name = "sniff-test-audit-gui"
version.workspace = true
edition.workspace = true
include = ["src/**", "build.rs", "frontend/package*.json", "frontend/index.html", "frontend/tsconfig.json", "frontend/src/**"]

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "io-util"] }
url = "2"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sniff-test-report = { path = "../sniff-test-report" }
sniff-test-audit-bridge = { path = "../sniff-test-audit-bridge" }
rust-embed = { version = "8", features = ["interpolate-folder-path", "debug-embed"] }
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
