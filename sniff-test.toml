[compiler]
# Compiler settings contribute to rustc's artifact identity.
overflow-checks = "profile"
inline-mir = "off"

[analysis]
# Workspace-only interpretation policy; dependency units cache facts silently.
show-full-stack-trace = false

[contracts]
# Contract evidence overrides only; trust boundaries remain domain-specific.
override-files = []

[panics]
# Stop only panic propagation introduced by Rust's unsafe-precondition macro;
# SafetyEffect still audits unsafe operations in the surrounding expansion.
ignored-namespaces = [
    "core::ub_checks::assert_unsafe_precondition",
    "syn", "syn::**",
    "quote", "quote::**",
    "proc_macro2", "proc_macro2::**",
    "rustc*", "rustc*::**",
]
# Matching implementations and their internal panic contracts are opaque. A
# matched API's own `# Panics` contract still propagates to non-trusted callers.
trusted-boundary-namespaces = []
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
    "core::{option,result}::unwrap_failed",
    "std::{option,result}::unwrap_failed",
]

[safety]
# Matching implementations and their internal safety contracts are opaque. A
# matched API's own `# Safety` contract still propagates to non-trusted callers;
# a direct local unsafe invocation still requires `// SAFETY:`.
trusted-boundary-namespaces = []
