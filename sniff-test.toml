[compiler]
# Compiler settings contribute to v13 artifact-IR validity.
overflow-checks = "profile"
inline-mir = "off"

[analysis]
# Workspace-only interpretation policy; dependency units cache IR silently.
show-full-stack-trace = false

[panics]
ignored-namespaces = [
    "syn", "syn::**",
    "quote", "quote::**",
    "proc_macro2", "proc_macro2::**",
    "rustc*", "rustc*::**",
]
# Add audited APIs here. Matching bodies are opaque and their `# Panics`
# documentation is trusted as complete.
trusted-panic-boundary-namespaces = []
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
    "core::{option,result}::unwrap_failed",
    "std::{option,result}::unwrap_failed",
]
