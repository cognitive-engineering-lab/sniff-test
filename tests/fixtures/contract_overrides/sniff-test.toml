[analysis]
effect-doc-matching = "exact"
report-roots = [
    "contract_overrides::panic_override_missing_marker",
    "contract_overrides::safety_override_missing_requirement",
]

[analysis.lints]
undocumented-effect-invocation = "deny"

[contracts]
override-files = ["override.toml"]

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]

[panics.lints]
documented-panic = "warn"

[safety.lints]
unsafe-call-missing-requirements = "warn"
