[analysis]
effect-doc-matching = "exact"
report-roots = [
    "contract_overrides::panic_override_missing_marker",
    "contract_overrides::safety_override_missing_requirement",
]

[analysis.lints]
undocumented-effect-invocation = "deny"

[contracts]
override-files = ["override.toml"]

[panic]
[panic.lints]
invocation = "warn"
