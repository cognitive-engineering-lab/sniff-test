[compiler]
inline-mir = "off"

[analysis]
report-roots = [
    "closure_call_graph::basic_closure_panics",
    "closure_call_graph::dyn_box_closure_boundary",
]

[panics]
# This fixture is about closure reachability, not allocator internals from Box::new.
ignored-namespaces = ["alloc::**"]
[safety]
# Keep the safety traversal scoped to the closure behavior under test too.
ignored-namespaces = ["alloc::**"]
[panics.lints]
operation = "deny"
invocation = "deny"
