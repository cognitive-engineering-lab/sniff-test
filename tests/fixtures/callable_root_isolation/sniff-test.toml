[compiler]
inline-mir = "off"

[analysis]
callable-edge-attribution = "call-sites"
report-roots = [
    "callable_root_isolation::selected_fn_pointer",
    "callable_root_isolation::selected_dyn_dispatch",
]

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]

[panics.lints]
indirect-call-boundary = "allow"
