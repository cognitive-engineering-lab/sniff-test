[compiler]
inline-mir = "off"

[analysis]
report-roots = [
    "async_runtime_bodies::async_root",
    "async_runtime_bodies::invoked_async_closure",
]

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]

[panics.lints]
operation = "allow"
invocation = "deny"

[safety.lints]
invocation = "deny"
