[analysis]
inline-mir = "off"
report-roots = [
    "panic_requirements::satisfied",
    "panic_requirements::unnamed_marker",
    "panic_requirements::bullet_without_marker",
    "panic_requirements::empty_marker",
    "panic_requirements::empty_requirement",
    "panic_requirements::safety_marker_does_not_satisfy_panic",
    "panic_requirements::safety_marker_stops_partial_panic_block",
]

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]
