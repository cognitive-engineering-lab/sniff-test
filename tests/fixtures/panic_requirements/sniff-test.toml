[compiler]
inline-mir = "off"

[analysis]
effect-doc-matching = "exact"
report-roots = [
    "panic_requirements::satisfied",
    "panic_requirements::partially_satisfied",
    "panic_requirements::documented_contract",
    "panic_requirements::reaches_documented_contract",
]

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]
