[compiler]
inline-mir = "off"

[analysis]
report-roots = ["local_generic_impl_contract::caller"]

[analysis.lints]
ambiguous-panic-marker = "allow"
ambiguous-safety-marker = "deny"
ambiguous-panic-requirement = "allow"
ambiguous-safety-requirement = "deny"
panic-analysis-incomplete = "deny"
safety-analysis-incomplete = "deny"

[panics.lints]
compiler-assert = "allow"
panic-invocation = "allow"
documented-panic = "allow"
trusted-panic = "allow"
indirect-call-boundary = "allow"

[safety.lints]
missing-safety-docs = "allow"
unsafe-call-missing-justification = "deny"
unsafe-call-missing-requirements = "deny"
unsafe-op-missing-justification = "deny"
safety-obligation-missing-justification = "deny"
safety-obligation-missing-requirements = "deny"
