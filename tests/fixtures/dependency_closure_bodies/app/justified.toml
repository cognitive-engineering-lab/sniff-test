[analysis]
report-roots = ["dependency_closure_app::justified", "dependency_closure_app::quiet_dispatch", "dependency_closure_app::inherited_safety", "dependency_closure_app::unused_closure"]

[compiler]
inline-mir = "off"

[panic]
trusted-boundary-namespaces = ["core", "std"]
[safety]
trusted-boundary-namespaces = ["core", "std"]
