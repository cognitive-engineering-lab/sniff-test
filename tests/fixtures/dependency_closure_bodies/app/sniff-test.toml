[analysis]
report-roots = ["dependency_closure_app::root", "dependency_closure_app::justified", "dependency_closure_app::unsafe_body"]

[compiler]
inline-mir = "off"

[panics]
trusted-boundary-namespaces = ["core", "std"]
panic-sink-namespaces = ["core::panicking::**"]

[safety]
trusted-boundary-namespaces = ["core", "std"]
