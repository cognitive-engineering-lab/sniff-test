[analysis]
report-roots = ["dependency_closure_app::quiet_dispatch", "dependency_closure_app::panicking_dispatch"]

[compiler]
inline-mir = "off"

[panics]
trusted-boundary-namespaces = ["core", "std"]
panic-sink-namespaces = ["core::panicking::**"]

[safety]
trusted-boundary-namespaces = ["core", "std"]
