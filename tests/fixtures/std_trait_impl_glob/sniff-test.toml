# Trait-impl methods such as `<Vec<T> as Index<usize>>::index` must match the
# configured trusted globs the same way inherent methods like `Vec::push` do.

[panics]
trusted-panic-boundary-namespaces = ["std::**", "core::**", "alloc::**"]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]

[panics.lints]
trusted-panic = "warn"

[safety]
# This fixture isolates panic-boundary glob matching, not allocator internals.
ignored-namespaces = ["std::**", "core::**", "alloc::**"]
