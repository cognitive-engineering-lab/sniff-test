[compiler]
inline-mir = "off"

[analysis]
report-roots = [
    "dependency_async_panic_app::workspace_async_root",
]

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]

[panics.lints]
compiler-assert = "allow"

[safety.lints]
unsafe-call-missing-justification = "deny"
