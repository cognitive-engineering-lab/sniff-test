[analysis]
report-roots = [
    "report_roots::private_panic",
    "report_roots::missing_root",
]

[analysis.lints]
missing-report-root = "allow"

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]

[panics.lints]
panic-invocation = "allow"
