[analysis]
effect-doc-matching = "exact"
report-roots = [
    "source_contract_overrides::caller",
    "source_contract_overrides::trait_api::caller",
]

[contracts]
override-files = ["override.toml"]

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]

[panics.lints]
panic-invocation = "warn"
documented-panic = "warn"
