[analysis]
callable-edge-attribution = "call-sites"

[panics]
trusted-panic-boundary-namespaces = [
    "trusted_boundaries::trusted_helper",
    "trusted_boundaries::trusted_doc_helper",
]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]

[safety]
trusted-safety-boundary-namespaces = [
    "trusted_boundaries::trusted_helper",
    "trusted_boundaries::unsafe_helper",
]
