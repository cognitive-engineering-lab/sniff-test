[analysis]
report-roots = [
    "trusted_boundaries::trusted_unresolved_wrapper",
    "trusted_boundaries::untrusted_unresolved_wrapper",
]

[panic]
trusted-boundary-namespaces = [
    "trusted_boundaries::trusted_unresolved_wrapper",
]

[panic.lints]

[safety]
trusted-boundary-namespaces = [
    "trusted_boundaries::trusted_unresolved_wrapper",
]

[safety.lints]

[panic.coverage]
unresolved-call-target = "warn"

[safety.coverage]
unresolved-call-target = "warn"
