[analysis]
report-roots = [
    "dyn_dispatch_call_site::locally_constructed_implementation_uses_trait_contract",
    "dyn_dispatch_call_site::unrelated_vtable_creation_does_not_select_an_implementation",
]

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]

[panics.lints]
documented-panic = "deny"
