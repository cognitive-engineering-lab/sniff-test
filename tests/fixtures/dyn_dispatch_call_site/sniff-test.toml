[analysis]
report-roots = [
    "dyn_dispatch_call_site::locally_constructed_implementation_uses_trait_contract",
    "dyn_dispatch_call_site::observed_casts_select_all_compatible_implementations",
]

[panic]
[panic.lints]
invocation = "deny"

[panic.coverage]
unresolved-call-target = "warn"

[safety.coverage]
unresolved-call-target = "warn"
