[compiler]
inline-mir = "off"

[analysis]
report-roots = [
    "dependency_unsafe_trait_call_app::justified_caller",
    "dependency_unsafe_trait_call_app::unjustified_caller",
    "dependency_unsafe_trait_call_app::ambiguous_dependency_contract",
]

[safety.lints]
unsafe-call-missing-justification = "deny"
unsafe-call-missing-requirements = "deny"
