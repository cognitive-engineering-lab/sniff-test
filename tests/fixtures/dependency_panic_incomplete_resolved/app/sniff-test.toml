[analysis]
node-limit = 2

[analysis.lints]
analysis-incomplete = "deny"
dependency-panic-analysis-incomplete = "warn"

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]

[safety]
ignored-namespaces = ["**"]
