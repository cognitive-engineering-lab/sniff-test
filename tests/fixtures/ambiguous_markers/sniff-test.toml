[analysis]
effect-doc-matching = "exact"
report-roots = [
    "ambiguous_markers::shared_block_marker",
    "ambiguous_markers::duplicate_name_marker",
    "ambiguous_markers::marker_covers_documented_call_and_sink",
    "ambiguous_markers::marked_path_to_shared_sources",
    "ambiguous_markers::unmarked_path_to_shared_sources",
]

[panics]
[panics.lints]
operation = "deny"
invocation = "deny"
