[analysis]
report-roots = [
    "ambiguous_markers::shared_block_marker",
    "ambiguous_markers::duplicate_name_marker",
]

[analysis.lints]
ambiguous-panic-marker = "allow"
ambiguous-panic-requirement = "allow"
ambiguous-safety-requirement = "allow"

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]
