[compiler]
inline-mir = "off"

[analysis]
report-roots = [
    "target_feature_call_safety::ordinary_caller",
    "target_feature_call_safety::matching_feature_caller",
    "target_feature_call_safety::matching_feature_closure_caller",
]

[analysis.lints]
ambiguous-panic-marker = "allow"
ambiguous-safety-marker = "allow"
ambiguous-panic-requirement = "allow"
ambiguous-safety-requirement = "allow"
panic-analysis-incomplete = "allow"
safety-analysis-incomplete = "allow"

[panics.lints]
compiler-assert = "allow"
panic-invocation = "allow"
documented-panic = "allow"
trusted-panic = "allow"
indirect-call-boundary = "allow"

[safety.lints]
missing-safety-docs = "allow"
unsafe-call-missing-justification = "deny"
unsafe-call-missing-requirements = "allow"
unsafe-op-missing-justification = "allow"
safety-obligation-missing-justification = "allow"
safety-obligation-missing-requirements = "allow"
