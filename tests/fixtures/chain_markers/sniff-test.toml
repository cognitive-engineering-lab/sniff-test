# A marker between method-chain links justifies that link without covering a
# separate unmarked chain.

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]

[panics.lints]
ambiguous-marker = "warn"
panic-invocation = "warn"
