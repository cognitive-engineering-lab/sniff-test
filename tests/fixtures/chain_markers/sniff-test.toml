# Markers between the links of a multi-line method chain justify exactly
# their link; a blanket marker above the statement does not reach links on
# other lines.

[panics]
panic-sink-namespaces = [
    "core::panicking::**",
    "std::panicking::**",
    "core::std::rt::panic_fmt",
    "std::rt::panic_fmt",
]
