[analysis]
report-roots = [
    "ambiguous_safety::reused_macro_marker",
    "ambiguous_safety::reused_nested_macro_marker",
    "ambiguous_safety::distinct_inner_markers_within_one_outer_macro_expansion",
]

[analysis.lints]
ambiguous-effect-marker = "deny"

[safety.lints]
unsafe-call-missing-justification = "deny"
