[analysis]
report-roots = [
    "ambiguous_safety::reused_marker_within_one_macro_expansion",
    "ambiguous_safety::reused_partial_marker_for_safe_obligations",
    "ambiguous_safety::reused_partial_marker_for_safe_obligations_inside_unsafe_block",
]

[safety.lints]
ambiguous-marker = "deny"
invocation = "deny"
